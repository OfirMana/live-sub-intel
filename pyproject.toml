[project]
name = "subintel"
version = "0.1.0"
description = "Live Substitution Intelligence: explainable substitution recommendations from a football event stream"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["openai>=1.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
